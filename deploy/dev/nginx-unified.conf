worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
# TCP passthrough: browser, API and Agent receive the backend's same certificate.
# Docker Desktop resolves host.docker.internal to the macOS backend listener.
stream {
    server {
        listen 443;
        proxy_pass host.docker.internal:8443;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
    }
}
