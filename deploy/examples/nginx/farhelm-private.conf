# Top-level nginx.conf context, not inside http {}. Requires stream module.
# Farhelm owns TLS and serves the web app, API and WSS with the same certificate.
stream {
    server {
        listen 443;
        listen [::]:443;
        proxy_pass 127.0.0.1:8443;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
