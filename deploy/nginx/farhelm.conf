# Include from nginx's http {} context. See docs/platform-entry.md.
map $http_upgrade $farhelm_connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 443 ssl;
    server_name fleet.example.com;
    ssl_certificate     /etc/farhelm/tls/public.crt;
    ssl_certificate_key /etc/farhelm/tls/public.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/farhelm/web;
    index index.html;
    client_max_body_size 64m;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    # Avoid logging sensitive request URLs; operational errors remain logged.
    access_log off;

    # The upstream certificate must cover this name and chain to this CA.
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    proxy_ssl_trusted_certificate /etc/farhelm/tls/backend-ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $farhelm_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_next_upstream off;

    # Preserve paths: /api/v1 (console), /api/agent (install/auth/files),
    # /agent/ws and /agent/address-probe (Agent control/address confirmation).
    location ~ ^/(api|agent)(/|$) {
        proxy_pass https://127.0.0.1:8443;
    }
    location = /healthz {
        proxy_pass https://127.0.0.1:8443;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
