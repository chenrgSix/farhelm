# Include from nginx's top-level context, NOT http {}.
# Requires ngx_stream_module. Do not also bind these ports in farhelm.conf.
# Farhelm serves the built web app, API and Agent WebSockets and owns TLS.
stream {
    server {
        listen 443;
        listen [::]:443;
        proxy_pass 127.0.0.1:8443;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
    server {
        listen 80;
        listen [::]:80;
        proxy_pass 127.0.0.1:8080;
        proxy_connect_timeout 5s;
        proxy_timeout 10s;
    }
}
